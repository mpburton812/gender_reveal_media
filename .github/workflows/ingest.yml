name: ingest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_episodes:
        description: >
          Max episodes to advance this run. Use 0 to process up to INGEST_EPISODES_CAP
          remaining eligible episodes in one run (one-shot backfill). Scheduled runs use 5.
        required: false
        default: "5"
        type: string

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run ingest pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TURSO_PREFER_HTTPS: ""
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export INGEST_MAX_EPISODES="${{ github.event.inputs.max_episodes }}"
          else
            export INGEST_MAX_EPISODES="5"
          fi
          python -m gender_reveal_media.cli ingest --trigger github_actions
