name: ingest

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
    inputs:
      max_episodes:
        description: >
          Max episodes to advance this run. Use 0 to process up to INGEST_EPISODES_CAP
          remaining eligible episodes in one run (one-shot backfill). Scheduled runs use 5.
        required: false
        default: "5"
        type: string
      populate_links:
        description: >
          After Gemini media extraction, fill link_to_media via catalog APIs
          (Open Library, MusicBrainz, OpenAlex, Internet Archive; TMDB for movies/TV).
          Optional GOOGLE_CSE_* secrets add fallback for games, graphic novels, etc.
        required: false
        default: false
        type: boolean

jobs:
  ingest:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install document converters
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc antiword libreoffice-writer-nogui

      - name: Install dependencies
        run: pip install -r requirements-ingest.txt

      - name: Run ingest pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          GOOGLE_CSE_API_KEY: ${{ secrets.GOOGLE_CSE_API_KEY }}
          GOOGLE_CSE_CX: ${{ secrets.GOOGLE_CSE_CX }}
          TURSO_PREFER_HTTPS: ""
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            export INGEST_MAX_EPISODES="${{ github.event.inputs.max_episodes }}"
          else
            export INGEST_MAX_EPISODES="5"
          fi
          EXTRA_ARGS=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.populate_links }}" = "true" ]; then
            EXTRA_ARGS+=(--populate-links)
          fi
          python -m gender_reveal_media.cli ingest --trigger github_actions "${EXTRA_ARGS[@]}"
